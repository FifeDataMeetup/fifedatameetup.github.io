---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>

  <p>
    <strong>📅 {{ page.date | date: "%A %-d %B %Y" }}</strong>{% if page.time %} · {{ page.time }}{% endif %}<br>
    {% if page.venue %}📍 {{ page.venue }}{% endif %}
  </p>

  {% if page.signup %}
  <p><a href="{{ page.signup }}">👉 Sign up for this event</a></p>
  {% endif %}

  {{ content }}

  <p><a href="{{ '/events/' | relative_url }}">← All events</a></p>
</article>
